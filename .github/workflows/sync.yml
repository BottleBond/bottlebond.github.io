name: YouTube Playlist Sync

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install sync dependencies
        working-directory: tools/sync
        run: npm ci

      - name: Run YouTube sync
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node tools/sync/sync.mjs

      # - name: Install Buzzsprout sync dependencies
      #   working-directory: tools/buzzsprout
      #   run: npm ci
      #
      # - name: Sync Buzzsprout data
      #   continue-on-error: true
      #   run: node tools/buzzsprout/sync.mjs

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/ content/episodes.md || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ content/episodes.md
          git commit -m "chore: sync YouTube and podcast data"
          git push
