{{ define "main" }}
<!-- FAQ Page -->
<section class="section section-default section-padding">
  <div class="container-luxury">
    <h1 class="text-center mb-4">Frequently Asked Questions</h1>
    <p class="text-center max-w-2xl mx-auto mb-12">
      Got questions about bourbon, whiskey, or the podcast? We've got answers.
    </p>

    <div class="max-w-3xl mx-auto">
      {{ $faqs := .Site.Data.faqs.faqs }}

      {{ if $faqs }}
        {{ range $faqs }}
        <div class="faq-item" onclick="toggleFaq(this)">
          <button class="faq-question">
            <span class="faq-question-text">{{ .question }}</span>
            <svg class="faq-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <div class="faq-answer">
            {{ .answer | markdownify }}
          </div>
        </div>
        {{ end }}
      {{ else }}
        <p class="text-center">Check back soon for our FAQ section!</p>
      {{ end }}
    </div>

  </div>
</section>

<script>
function toggleFaq(element) {
  element.classList.toggle('open');
}
</script>
{{ end }}
