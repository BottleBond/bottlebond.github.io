{{/* BottleBond Analytics — Consent-first tracking */}}
{{ if .Site.Params.analytics }}

{{/* Consent Banner */}}
<div id="bb-consent-banner" class="bb-consent-banner" style="display:none;">
  <div class="bb-consent-inner">
    <p>We use cookies and tracking to improve your experience and understand how our site is used.</p>
    <div class="bb-consent-buttons">
      <button id="bb-consent-accept" class="btn btn-sm btn-template-main">Accept</button>
      <button id="bb-consent-decline" class="btn btn-sm btn-default">Decline</button>
    </div>
  </div>
</div>

<script>
(function() {
  var consent = localStorage.getItem('bb-consent');
  if (consent === null) {
    document.getElementById('bb-consent-banner').style.display = 'block';
  } else if (consent === 'accepted') {
    loadTracking();
  }

  document.getElementById('bb-consent-accept').addEventListener('click', function() {
    localStorage.setItem('bb-consent', 'accepted');
    document.getElementById('bb-consent-banner').style.display = 'none';
    loadTracking();
  });

  document.getElementById('bb-consent-decline').addEventListener('click', function() {
    localStorage.setItem('bb-consent', 'declined');
    document.getElementById('bb-consent-banner').style.display = 'none';
  });

  function loadTracking() {
    {{ with .Site.Params.analytics.ga4_id }}
    // Google Analytics 4
    var gs = document.createElement('script');
    gs.async = true;
    gs.src = 'https://www.googletagmanager.com/gtag/js?id={{ . }}';
    document.head.appendChild(gs);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function() { dataLayer.push(arguments); };
    gtag('js', new Date());
    gtag('config', '{{ . }}');
    {{ end }}

    {{ with .Site.Params.analytics.meta_pixel_id }}
    // Meta Pixel
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '{{ . }}');
    fbq('track', 'PageView');
    {{ end }}

    {{ with .Site.Params.analytics.tiktok_pixel_id }}
    // TikTok Pixel
    !function(w,d,t){w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=
    ["page","track","identify","instances","debug","on","off","once","ready","alias",
    "group","enableCookie","disableCookie"];ttq.setAndDefer=function(t,e){t[e]=function()
    {t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};for(var i=0;i<
    ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);ttq.instance=function(t)
    {for(var e=ttq._i[t]||[],n=0;n<ttq.methods.length;n++)ttq.setAndDefer(e,ttq.methods[n]);
    return e};ttq.load=function(e,n){var i="https://analytics.tiktok.com/i18n/pixel/events.js";
    ttq._i=ttq._i||{};ttq._i[e]=[];ttq._i[e]._u=i;ttq._t=ttq._t||{};ttq._t[e]=+new Date;
    ttq._o=ttq._o||{};ttq._o[e]=n||{};var o=document.createElement("script");o.type=
    "text/javascript";o.async=!0;o.src=i+"?sdkid="+e+"&lib="+t;var a=
    document.getElementsByTagName("script")[0];a.parentNode.insertBefore(o,a)};
    ttq.load('{{ . }}');ttq.page()}(window,document,'ttq');
    {{ end }}
  }

  // Global tracking wrapper
  window.bbTrack = function(eventName, eventData) {
    if (localStorage.getItem('bb-consent') !== 'accepted') return;
    eventData = eventData || {};
    // GA4
    if (window.gtag) { gtag('event', eventName, eventData); }
    // Meta Pixel
    if (window.fbq) { fbq('trackCustom', eventName, eventData); }
    // TikTok Pixel
    if (window.ttq) { ttq.track(eventName, eventData); }
  };
})();
</script>
{{ end }}
